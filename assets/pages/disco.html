<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/catalogo.css">
  <link rel="stylesheet" href="../css/disco.css">
  <title>Disco | Vinyl Figures Store</title>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header>
    <nav>
      <a href="../../index.html">Vinyl Records</a>

      <ul>
        <li><a href="../../index.html">Início</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="carrinho.html">Carrinho</a></li>
        <li><a href="conta.html">Conta</a></li>
        <li><button type="button" data-acao="alternar-tema">Tema</button></li>
      </ul>
    </nav>
  </header>

  <main>

    <nav aria-label="Você está aqui">
      <ol>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li aria-current="page">Carregando…</li>
      </ol>
    </nav>

    <article>
      <div class="disco-capa"></div>

      <div>
        <h1>Carregando…</h1>
        <p class="disco-artistas"></p>
        <p class="disco-preco"></p>
        <ul class="disco-generos"></ul>
        <p class="disco-descricao"></p>
        <p class="disco-lancamento"></p>

        <!-- Stepper (−/input/+) e "Adicionar ao carrinho", igual ao card
             do catálogo, reaproveitando as mesmas classes de catalogo.css. -->
        <div class="linha-acao-catalogo">
          <div class="stepper-qtd">
            <button type="button" data-acao="qtd-disco-menos" aria-label="Diminuir quantidade">−</button>
            <input type="number" id="qtd-disco" min="1" value="1" aria-label="Quantidade">
            <button type="button" data-acao="qtd-disco-mais" aria-label="Aumentar quantidade">+</button>
          </div>
          <button type="button" data-acao="adicionar-carrinho-disco">Adicionar ao carrinho</button>
        </div>
      </div>
    </article>

    <!-- Estado sem resultado: id inválido, removido ou ausente na URL -->
    <section hidden>
      <h2>Disco não encontrado</h2>
      <p>Esse disco não existe ou foi removido. <a href="catalogo.html">Voltar ao catálogo</a>.</p>
    </section>

  </main>

  <footer>
    <nav>
      <ul>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="conta.html">Minha conta</a></li>
        <li><a href="entrar.html">Entrar</a></li>
        <li><a href="cadastro.html">Criar conta</a></li>
      </ul>
    </nav>
    <p>&copy; 2026 Vinyl Records</p>
  </footer>

  <script type="module" src="../js/controller/disco.js"></script>

</body>
</html>
