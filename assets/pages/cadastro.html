  <!-- ===== NAVBAR ===== -->
  <header>

      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>

        <li><a href="conta.html">Conta</a></li>

  <main>

    <nav aria-label="Você está aqui">
      <ol>
        <li><a href="index.html">Início</a></li>
        <li aria-current="page">Criar conta</li>
      </ol>
    </nav>

    <h1>Criar conta</h1>

    <form action="conta.html" method="post">
      <label for="cad-nome">Nome completo</label>
      <input type="text" id="cad-nome" name="nome" autocomplete="name" required>

      <label for="cad-email">E-mail</label>
      <input type="email" id="cad-email" name="email" autocomplete="email" required>

      <label for="cad-senha">Senha</label>
      <input type="password" id="cad-senha" name="senha" autocomplete="new-password" required>

      <label for="cad-senha-confirma">Confirmar senha</label>
      <input type="password" id="cad-senha-confirma" name="senha_confirma" autocomplete="new-password" required>

      <label>
        <input type="checkbox" name="newsletter" value="1">
        Quero receber novidades de lançamentos
      </label>

      <button type="submit">Criar conta</button>
    </form>

    <p>Já tem conta? <a href="entrar.html">Entrar</a></p>

  </main>

  <footer>
